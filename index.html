<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F6F1E4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131612" media="(prefers-color-scheme: dark)">
<meta name="description" content="一天怎么过：作息与 28 天菜单。">
<title>一天怎么过</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23F6F1E4'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23A26246'%3E%E4%B8%80%3C/text%3E%3C/svg%3E">
<style>

:root{
  color-scheme: light dark;
  --paper:#F6F1E4; --paper-2:#FBF7EC; --card:#FFFDF8;
  --ink:#1F241C; --ink-soft:#4B5445; --muted:#7B8173;
  --rule:#E4DDCB; --rule-2:#D3CBAF;
  --terra:#A26246; --sage:#6B7D55; --mustard:#B5863C; --teal:#3F7573; --dusk:#4A6371;
  --today:rgba(181,134,60,.13);
  --shadow:0 1px 2px rgba(45,37,20,.05), 0 20px 44px -30px rgba(45,37,20,.55);
  --max:1040px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#131612; --paper-2:#191D17; --card:#1C211B;
    --ink:#EDE9DC; --ink-soft:#BCC2B2; --muted:#8B9284;
    --rule:#2A2F28; --rule-2:#3B4137;
    --terra:#C68D6E; --sage:#8FA477; --mustard:#CDA45C; --teal:#74A8A5; --dusk:#88A0AE;
    --today:rgba(205,164,92,.12);
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 20px 44px -30px rgba(0,0,0,.9);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-size:16px;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(120,105,70,.05) 1px,transparent 1px);background-size:5px 5px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 22px;position:relative;z-index:1}
.mono{font-family:"JetBrains Mono",Consolas,"Courier New",monospace}

/* ---------- 头 ---------- */
header{padding:40px 0 8px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand{font-family:"Source Han Serif SC","Noto Serif SC","Songti SC",SimSun,serif;
  font-size:clamp(30px,4.6vw,44px);font-weight:700;letter-spacing:.02em;line-height:1.1}
.top .sub{font-size:13.5px;color:var(--muted);letter-spacing:.04em}
.nowcard{margin-top:18px;background:var(--card);border:1px solid var(--rule);border-radius:8px;
  padding:22px 26px 20px;box-shadow:var(--shadow);display:grid;gap:8px;position:relative;overflow:hidden}
.nowcard::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(181,134,60,.14),transparent 70%)}
.nowline{font-family:"JetBrains Mono",Consolas,monospace;font-size:13.5px;color:var(--muted);letter-spacing:.03em}
.nowline b{color:var(--terra);font-weight:600;font-size:15px}
.nowdish{font-size:clamp(20px,3vw,27px);font-weight:700;line-height:1.4;letter-spacing:.01em}
.nowdish em{font-style:normal;font-size:14px;font-weight:400;color:var(--muted);margin-right:10px;letter-spacing:.06em}
.dots{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center}
.dot-btn{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--rule);
  color:var(--muted);font:inherit;font-size:13px;padding:6px 14px 6px 10px;border-radius:99px;cursor:pointer;transition:.2s}
.dot-btn i{width:10px;height:10px;border-radius:50%;border:1.6px solid var(--rule-2);transition:.2s}
.dot-btn:hover{border-color:var(--rule-2);color:var(--ink)}
.dot-btn[aria-pressed="true"]{color:var(--sage);border-color:rgba(107,125,85,.5);background:rgba(107,125,85,.08)}
.dot-btn[aria-pressed="true"] i{background:var(--sage);border-color:var(--sage)}
.nowcard .tip{font-size:12px;color:var(--muted)}

/* ---------- 分区 ---------- */
section{padding:38px 0 6px}
.sec-h{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:16px}
.sec-h .idx{font-family:"JetBrains Mono",Consolas,monospace;font-size:11px;color:var(--terra);letter-spacing:.16em}
.sec-h h2{font-family:"Source Han Serif SC","Songti SC",SimSun,serif;font-size:clamp(20px,2.6vw,26px);letter-spacing:.08em;white-space:nowrap}
.sec-h .aside{margin-left:auto;font-size:12.5px;color:var(--muted)}
.sec-h .aside button{font:inherit;font-size:12.5px;background:none;border:1px dashed var(--rule-2);
  border-radius:99px;padding:3px 12px;color:var(--ink-soft);cursor:pointer}
.sec-h .aside button:hover{border-color:var(--mustard);color:var(--mustard)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow)}

/* ---------- 色带 ---------- */
.ribbon{padding:16px 18px 12px}
.rb{position:relative;display:flex;height:34px;border-radius:5px;overflow:hidden;cursor:pointer;outline-offset:4px}
.pickbar{display:none;margin-top:10px;padding-top:9px;border-top:1px dashed var(--rule);font-size:13px;color:var(--ink-soft);align-items:baseline;gap:10px;flex-wrap:wrap}
.pickbar.on{display:flex}
.pickbar b{font-family:"JetBrains Mono",Consolas,monospace;font-size:12.5px;color:var(--terra);font-weight:600}
.pickbar .k{font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
.pickbar .v{color:var(--ink);font-weight:600}
.pickbar .go{margin-left:auto;font-size:11.5px;color:var(--muted)}
.seg{height:100%;position:relative;cursor:pointer;transition:filter .2s}
.seg:hover{filter:brightness(1.06)}
.seg + .seg{box-shadow:inset 1px 0 0 rgba(255,255,255,.7)}
.seg span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;letter-spacing:.16em;color:#fff;opacity:.92;white-space:nowrap}
.t-ritual{background:#C8A369}.t-meal{background:#AC7458}.t-leisure{background:#BE9C52}
.t-work{background:#97A08F}.t-study{background:#5A7380}.t-rest{background:#7C8F66}
.t-commute{background:#DAD3BF}.t-swim{background:#3F7573}.t-recover{background:#7CA3A0}
.t-sleep{background:#3B4238}.t-free{background:repeating-linear-gradient(135deg,#DFD8C4 0 7px,#E9E3D2 7px 14px)}
.t-gap{background:rgba(0,0,0,.035)}
@media (prefers-color-scheme: dark){
  .t-ritual{background:#7C6535}.t-meal{background:#7E5344}.t-leisure{background:#7B6531}
  .t-work{background:#4C554A}.t-study{background:#3A4A54}.t-rest{background:#4B5741}
  .t-commute{background:#383D33}.t-swim{background:#2C4E4D}.t-recover{background:#3C5856}
  .t-sleep{background:#0C0F0B}.t-gap{background:#1E221C}
  .t-free{background:repeating-linear-gradient(135deg,#282D26 0 7px,#323830 7px 14px)}
}
.rb-axis{position:relative;height:16px;margin-top:5px}
.rb-axis i{position:absolute;top:0;transform:translateX(-50%);font-style:normal;
  font-family:"JetBrains Mono",Consolas,monospace;font-size:9.5px;color:var(--muted)}
.rb-axis i:first-child{transform:none}
.rb-axis i:last-child{transform:translateX(-100%)}
.now-dot{position:absolute;top:-6px;width:2px;height:46px;background:var(--terra)}
.now-dot::before{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;
  background:var(--terra);box-shadow:0 0 0 4px rgba(162,98,70,.18)}

/* ---------- 日型切换 ---------- */
.daytype{display:inline-flex;gap:2px;margin-left:12px;padding:2px;border:1px solid var(--rule);
  border-radius:99px;background:rgba(255,253,247,.5);vertical-align:middle}
.daytype button{font:inherit;font-size:11.5px;border:none;background:none;color:var(--muted);
  padding:3px 10px;border-radius:99px;cursor:pointer;transition:.2s;line-height:1.4}
.daytype button:hover{color:var(--ink)}
.daytype button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
@media (prefers-color-scheme: dark){ .daytype{background:rgba(255,255,255,.03)} }

/* ---------- 时间轴 ---------- */
.tl{position:relative;margin-top:12px;border-radius:10px;
  background:linear-gradient(180deg,rgba(200,163,105,.07),rgba(200,163,105,0) 26%,
    rgba(90,115,128,.05) 58%,rgba(63,117,115,.045) 78%,rgba(59,66,56,.05))}
.tl::before{content:"";position:absolute;left:106px;top:14px;bottom:16px;width:2px;
  background:linear-gradient(180deg,rgba(178,140,84,.7),rgba(110,132,140,.6) 42%,rgba(63,117,115,.6) 68%,rgba(70,80,64,.6))}
.band{display:flex;align-items:center;gap:9px;margin:16px 0 7px}
.band:first-child{margin-top:4px}
.band b{font-family:"Source Han Serif SC","Songti SC",SimSun,serif;font-size:15px;letter-spacing:.14em;color:var(--ink-soft)}
.band span{font-family:"JetBrains Mono",Consolas,monospace;font-size:9.5px;color:var(--muted);letter-spacing:.06em}
.band::after{content:"";flex:1;height:1px;background:var(--rule)}
.tl .row{display:grid;grid-template-columns:80px 34px 1fr;gap:10px;align-items:start;
  padding:6px 8px 6px 0;border-radius:9px;position:relative;transition:background .25s}
.tl .row.mid{padding-top:9px;padding-bottom:9px}
.tl .row.long{padding-top:12px;padding-bottom:12px}
.tl .row:hover{background:rgba(162,98,70,.05)}
.tl .row.now{background:var(--today)}
.tl .row.now .tt::after{content:"现在";display:block;font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:8.5px;letter-spacing:.1em;color:var(--terra);margin-top:2px}
.tl .row.hit{animation:hit 1.9s cubic-bezier(.2,.8,.2,1)}
.tl .row.hit::after{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--mustard)}
@keyframes hit{0%{background:rgba(181,134,60,.30)}45%{background:rgba(181,134,60,.16)}100%{background:transparent}}
.tl .tt{font-family:"JetBrains Mono",Consolas,monospace;font-size:10.5px;color:var(--muted);
  text-align:right;padding-top:9px;white-space:nowrap;letter-spacing:-.01em}
.rail{display:flex;justify-content:center;padding-top:3px}
.node{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);
  border:1px solid var(--rule-2);color:var(--ink-soft);position:relative;z-index:1;box-shadow:0 0 0 3px var(--paper)}
.node svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.node.meal{color:var(--terra);border-color:rgba(162,98,70,.4)}
.node.work{color:#7E8A79}
.node.study{color:var(--dusk)}
.node.swim{color:var(--teal);border-color:rgba(63,117,115,.4)}
.node.leisure{color:var(--mustard)}
.node.rest{color:var(--sage)}
.node.ritual{color:#B98A3F}
.node.recover{color:#6E9B98}
.node.sleep{color:var(--ink)}
.node.commute{color:var(--muted)}
.node.free{color:var(--muted);border-style:dashed}
.tl .label{font-size:15px;line-height:1.5}
.tl .row.meal .label{font-weight:600}
.tl .row.swim .label{font-weight:600;color:var(--teal)}
.tl .meta{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.tl .dur{font-family:"JetBrains Mono",Consolas,monospace;font-size:9.5px;color:var(--muted);
  background:rgba(0,0,0,.035);border-radius:99px;padding:1px 8px;flex:none}
.tl .dish{margin-top:7px;background:var(--paper-2);border:1px solid var(--rule);border-radius:7px;padding:8px 12px}
.tl .dish .nm{font-size:14px;font-weight:600;line-height:1.45}
.tl .dish .nt{font-size:11.5px;color:var(--muted);margin-top:1px}
.tl .branch{font-size:12px;color:var(--teal);margin-top:4px}
@media (prefers-color-scheme: dark){
  .tl .dur{background:rgba(255,255,255,.05)}
  .node{border-color:var(--rule)}
  .node.work{color:#A6B29B}
  .node.ritual{color:#D6AD6C}
  .node.recover{color:#8FBDB9}
  .node.commute{color:#9AA394}
  .tl::before{background:linear-gradient(180deg,rgba(190,150,90,.5),rgba(120,145,155,.45) 42%,rgba(80,140,136,.45) 68%,rgba(120,130,110,.4))}
}
/* ---------- 今天吃什么 ---------- */
.datenav{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.datenav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--card);
  color:var(--ink-soft);font-size:17px;cursor:pointer;line-height:1;transition:.2s}
.datenav button:hover{border-color:var(--terra);color:var(--terra);transform:translateY(-1px)}
.datenav .d{font-size:14px;color:var(--ink-soft);letter-spacing:.02em}
.datenav .d b{font-family:"Source Han Serif SC","Songti SC",SimSun,serif;font-size:19px;color:var(--ink);letter-spacing:.04em}
.datenav .tag{font-size:12px;color:var(--muted)}
.datenav .ping{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
  color:var(--mustard);border:1px solid rgba(181,134,60,.4);background:var(--today);border-radius:99px;padding:4px 12px;
  transform:rotate(-1.5deg)}
.today-grid{display:grid;gap:14px}
@media (min-width:820px){ .today-grid{grid-template-columns:1fr 1fr 1fr} }
.eatcard{background:var(--card);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow);
  padding:18px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;transition:.25s}
.eatcard:hover{transform:translateY(-2px)}
.eatcard .ico{width:40px;height:40px;color:var(--ink-soft)}
.eatcard .ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.eatcard .k{font-family:"JetBrains Mono",Consolas,monospace;font-size:10.5px;letter-spacing:.18em;color:var(--muted)}
.eatcard .nm{font-size:18px;font-weight:700;line-height:1.35;margin-top:4px;letter-spacing:.01em}
.eatcard .nt{font-size:12.5px;color:var(--muted);margin-top:5px}
.eatcard .snack{font-size:12px;color:var(--teal);margin-top:7px}
.eatcard .tick{width:30px;height:30px;border-radius:50%;border:1.6px solid var(--rule-2);background:none;cursor:pointer;
  position:relative;transition:.2s;margin-top:2px}
.eatcard .tick:hover{border-color:var(--sage)}
.eatcard .tick[aria-pressed="true"]{background:var(--sage);border-color:var(--sage)}
.eatcard .tick[aria-pressed="true"]::after{content:"";position:absolute;left:7px;top:11px;width:12px;height:6px;
  border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg)}
.eatcard.done{opacity:.6}
.eatcard.done .nm{text-decoration:line-through;text-decoration-color:rgba(107,125,85,.55)}

/* ---------- 28 天 ---------- */
.weeks{display:grid;gap:18px;margin-top:4px}
.wk{background:var(--card);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.wk-top{display:flex;align-items:baseline;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--rule)}
.wk-no{font-family:"Source Han Serif SC","Songti SC",SimSun,serif;font-size:30px;line-height:.9;
  color:transparent;-webkit-text-stroke:1.1px var(--rule-2)}
.wk-name{font-family:"Source Han Serif SC","Songti SC",SimSun,serif;font-size:18px;font-weight:700;letter-spacing:.12em}
.wk-sub{font-size:12px;color:var(--muted);margin-left:auto;letter-spacing:.04em}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl thead th{font-size:10.5px;letter-spacing:.18em;color:var(--muted);font-weight:600;text-align:left;
  padding:10px 14px 8px;border-bottom:1px solid var(--rule);background:rgba(0,0,0,.012)}
.tbl thead th:first-child{width:96px;padding-left:20px}
.tbl tbody tr{border-top:1px solid var(--rule)}
.tbl tbody tr:first-child{border-top:none}
.tbl .day{font-size:14px;font-weight:600;padding:12px 8px 12px 20px;vertical-align:top;white-space:nowrap}
.tbl .day .n{display:block;font-family:"JetBrains Mono",Consolas,monospace;font-size:9.5px;color:var(--rule-2);font-weight:400}
.tbl .tag{display:block;margin-top:5px;font-size:9px;letter-spacing:.06em;padding:1px 5px;border:1px solid currentColor;
  border-radius:2px;width:fit-content}
.tag.swim{color:var(--teal)} .tag.egg{color:var(--terra)} .tag.rest{color:var(--muted)} .tag.now{color:var(--mustard);border-color:var(--mustard);background:var(--today)}
.tbl td.cell{padding:12px 14px;vertical-align:top;border-left:1px solid var(--rule);cursor:pointer;transition:background .18s}
.tbl td.cell:hover{background:rgba(181,134,60,.06)}
.tbl td.cell .nm{font-size:13.5px;font-weight:600;line-height:1.45;display:flex;gap:6px}
.tbl td.cell .nm svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--ink-soft);
  fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tbl td.cell .nt{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.tbl td.cell .snack{font-size:11px;color:var(--teal);margin-top:4px}
.tbl td.cell .mark{position:absolute;opacity:0}
.tbl td.cell{border-left:1px solid var(--rule)}
.tbl td.cell.done{background:rgba(107,125,85,.07)}
.tbl td.cell.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(107,125,85,.5)}
.tbl td.cell.done .nt::after{content:" ✓";color:var(--sage);font-weight:700}
.tbl tr.today td{background:var(--today)}
.tbl tr.today td.cell:hover{background:rgba(181,134,60,.16)}

footer{padding:34px 0 46px;margin-top:22px;border-top:1px solid var(--rule);color:var(--muted);font-size:12.5px}
footer .row2{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
footer button{font:inherit;font-size:12.5px;background:none;border:1px solid var(--rule);border-radius:99px;
  padding:6px 14px;color:var(--ink-soft);cursor:pointer}
footer button:hover{border-color:var(--terra);color:var(--terra)}

#gate{position:fixed;inset:0;background:var(--paper);display:none;place-items:center;z-index:100;padding:24px}
#gate.on{display:grid}
#gate .box{width:100%;max-width:320px;text-align:center}
#gate h2{font-family:"Source Han Serif SC","Songti SC",SimSun,serif;font-size:18px;letter-spacing:.1em;margin-bottom:14px}
#gate input{width:100%;padding:11px 14px;border:1px solid var(--rule-2);border-radius:6px;background:var(--card);
  color:var(--ink);font:inherit;font-size:15px;text-align:center;letter-spacing:.2em}
#gate button{margin-top:12px;width:100%;padding:10px;border:none;border-radius:6px;background:var(--ink);
  color:var(--paper);font:inherit;font-size:14px;cursor:pointer}
#gate .err{margin-top:10px;font-size:12px;color:var(--terra);min-height:16px}

@media (max-width:640px){
  .datenav .ping{flex-basis:100%;order:9;margin-top:2px}
}
@media (max-width:640px){
  .sec-h{flex-wrap:wrap;row-gap:8px}
  .sec-h .aside{width:100%;margin-left:0;display:flex;align-items:center;gap:8px}
  .daytype{margin-left:auto}
}
@media (max-width:819px){
  .tl .row{grid-template-columns:68px 30px 1fr;gap:8px}
  .tl::before{left:90px}
  .tl .tt{font-size:9px}
  .node{width:26px;height:26px}
  .node svg{width:15px;height:15px}
  .tl .tt{font-size:9.5px}
  .tl .label{font-size:14px}
  header{padding-top:26px}
  .nowcard{padding:18px 18px 16px}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:auto}
  .tbl tbody tr{border-top:1px solid var(--rule-2);padding:10px 16px 12px}
  .tbl .day{padding:0 0 6px;font-size:14.5px}
  .tbl .day .n{display:inline;margin-right:6px}
  .tbl .tag{display:inline-block;margin:4px 4px 0 0}
  .tbl td.cell{border-left:none;padding:6px 0 0}
  .tbl td.cell::before{content:attr(data-l);display:block;font-family:"JetBrains Mono",Consolas,monospace;
    font-size:9px;letter-spacing:.16em;color:var(--muted);margin-bottom:2px}
  .tbl tr.today td{background:transparent}
  .tbl tbody tr.today{background:var(--today)}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000}
  body::before,.now-dot,footer .row2,.sec-h .aside button,#gate{display:none!important}
  .eatcard,.wk,.nowcard,.card{box-shadow:none;break-inside:avoid}

/* 现在 */
function pickMeal(m){
  const plan=planFor(new Date()), rows=rowsOf(dayType(new Date()));
  const inMeal=rows.find(r=>r.meal&&m>=r.s&&m<r.e);          // 正在这顿饭的时间窗里
  if(inMeal) return {key:inMeal.meal, pl:plan, when:'今天', eating:true};
  const next=rows.find(r=>r.meal&&r.s>m);                     // 还没到这顿
  if(next) return {key:next.meal, pl:plan, when:'今天', eating:false};
  return {key:'b', pl:planFor(addDays(new Date(),1)), when:'明天', eating:false}; // 今天吃完了
}
function updateNowDot(){
  const dot=$('#nowdot'); if(!dot) return;
  const m=new Date().getHours()*60+new Date().getMinutes()-DAY_START;
  if(m>=0&&m<=TOTAL){ dot.style.display=''; dot.style.left=(m/TOTAL*100)+'%'; }
  else dot.style.display='none';
}
function renderNow(){
  const now=new Date(), m=now.getHours()*60+now.getMinutes()-DAY_START;
  const isToday=m>=0&&m<=TOTAL;
  const rows=rowsOf(dayType(now));
  const next=rows.find(r=>r.s>Math.max(m,0))||rows[0];
  const pick=pickMeal(m);
  const hhmm=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  $('#nowline').innerHTML = isToday
    ? (pick.eating ? `现在 <b>${hhmm}</b> · ${MEALK[pick.key]}时间`
                   : `现在 <b>${hhmm}</b> · 接下来 ${next.t.split('–')[0]} ${next.short}`)
    : `现在 <b>${hhmm}</b> · ${m<0?'今天 06:30 才开始':'今天已经收工'}`;
  $('#nowdish').innerHTML=`<em>${pick.when}${MEALK[pick.key]}</em>${pick.pl[pick.key][0]}`;
  const e=eatenOf(now);
  $$('#nowdots .dot-btn').forEach(b=>b.setAttribute('aria-pressed',!!e[b.dataset.k]));
  const sameDay=state.view===dayType(now);
  $$('.tl .row').forEach(r=>r.classList.toggle('now',sameDay&&isToday&&m>=+r.dataset.s&&m<+r.dataset.e));
  updateNowDot();
}

/* 色带 */
function renderRibbon(){
  const segs=[]; let cur=0;
  rowsOf(state.view).forEach(r=>{
    if(r.s>cur) segs.push({s:cur,e:r.s,type:'gap'});
    segs.push({s:r.s,e:r.e,type:r.type,label:(r.type==='work'?r.label:'')});
    cur=r.e;
  });
  $('#rb').innerHTML=segs.map(x=>{
    const w=(x.e-x.s)/TOTAL*100;
    const lab=(x.e-x.s)>=130?(x.label||({work:'工作',study:'学习',swim:'游泳',meal:'吃饭'}[x.type]||'')):'';
    return `<div class="seg t-${x.type}" style="width:${w}%" data-s="${x.s}"><span>${lab}</span></div>`;
  }).join('')+'<div class="now-dot" id="nowdot"></div>';
  const rb=$('#rb');
  rb.onclick=e=>{
    const r=rb.getBoundingClientRect();
    const ratio=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    seek(ratio*TOTAL);
  };
  rb.onkeydown=e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();seek(nowMin()-DAY_START);}
  };
  updateNowDot();
}

/* 定位：点色带 → 选中条 + 高亮 + 平滑滚动（自己算缓动，不依赖浏览器的 smooth） */
const easeOut=t=>1-Math.pow(1-t,3);
function smoothTo(y){
  const root=document.documentElement, prev=root.style.scrollBehavior;
  root.style.scrollBehavior='auto';           // 避免 CSS smooth 和逐帧滚动打架
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){ window.scrollTo(0,y); root.style.scrollBehavior=prev; return; }
  const start=window.scrollY, dist=y-start, t0=performance.now(), dur=Math.min(680,260+Math.abs(dist)*0.35);
  (function step(t){
    const k=Math.min(1,(t-t0)/dur);
    window.scrollTo(0,start+dist*easeOut(k));
    if(k<1) requestAnimationFrame(step);
    else root.style.scrollBehavior=prev;
  })(t0);
}
function seek(min){
  const rows=rowsOf(state.view);
  let row=rows.find(r=>min>=r.s&&min<r.e);
  if(!row){
    const dist=r=>min<r.s?r.s-min:(min>r.e?min-r.e:0);
    row=rows.reduce((a,b)=>dist(b)<dist(a)?b:a, rows[0]);
  }
  const node=$$('.tl .row').find(n=>+n.dataset.s===row.s);
  if(!node) return;
  const plan=planFor(new Date());
  const detail = row.meal ? `${MEALK[row.meal]} · ${plan[row.meal][0]}` : row.label.replace(/^[✨✅]\s*/,'');
  const pb=$('#pickbar');
  pb.innerHTML=`<b>${row.t.split('–')[0]}</b><span class="k">${row.d}</span><span class="v">${detail}</span>`
    +`<span class="go">已在下面高亮 ↓</span>`;
  pb.classList.add('on');
  node.classList.remove('hit'); void node.offsetWidth; node.classList.add('hit');
  clearTimeout(node._hit); node._hit=setTimeout(()=>node.classList.remove('hit'),2000);
  const rc=node.getBoundingClientRect();
  if(rc.top<90 || rc.bottom>innerHeight-24){
    smoothTo(rc.top+window.scrollY-140);
  }
}

const BANDS={morning:['早上','06:30 – 08:00'],day:['白天','08:00 – 18:00'],evening:['晚上','18:05 – 23:30']};
const BAND_AT={0:'morning',1:'morning',2:'morning',3:'morning',4:'day',5:'day',6:'day',7:'day',8:'day',9:'day',
  10:'evening',11:'evening',12:'evening',13:'evening',14:'evening',15:'evening'};
function renderTimeline(){
  const today=new Date(), plan=planFor(today), rows=rowsOf(state.view);
  const sameDay = state.view===dayType(today);
  const m=today.getHours()*60+today.getMinutes()-DAY_START;
  let html='', prev='';
  rows.forEach(r=>{
    const band=bandOf(r.s);
    if(band!==prev){ const b=BANDS[band]; html+=`<div class="band"><b>${b[0]}</b><span>${b[1]}</span></div>`; prev=band; }
    let extra='', glyph='<svg viewBox="0 0 24 24">'+(GLYPHS[r.type]||GLYPHS.work)+'</svg>';
    if(r.meal){
      const mm=plan[r.meal];
      glyph=(ICONS[mm[0]]||'').replace('class="ico" ','');
      const snack=(r.meal==='l'&&plan.s)?`<div class="branch">泳前加餐：${plan.s}</div>`:'';
      extra=`<div class="dish"><div class="nm">${mm[0]}</div><div class="nt">${mm[1]}</div>${snack}</div>`;
    }
    const span=r.e-r.s, size=span>=90?'long':(span>=40?'mid':'');
    const isNow = sameDay && m>=r.s && m<r.e;
    html+=`<div class="row ${r.type} ${size}${isNow?' now':''}" data-s="${r.s}" data-e="${r.e}">
      <div class="tt">${r.t}</div>
      <div class="rail"><span class="node ${r.type}">${glyph}</span></div>
      <div><div class="meta"><span class="label">${r.label}</span><span class="dur">${r.d}</span></div>${extra}</div>
    </div>`;
  });
  $('#tl').innerHTML=html;
}

/* 今天吃什么 */
function renderToday(){
  const d=addDays(new Date(),state.dayOffset), plan=planFor(d), e=eatenOf(d);
  const wd='周'+'日一二三四五六'[d.getDay()];
  const tag=state.dayOffset===0?'今天':state.dayOffset===1?'明天':state.dayOffset===-1?'昨天':
    (state.dayOffset>0?state.dayOffset+' 天后':Math.abs(state.dayOffset)+' 天前');
  $('#datenav').innerHTML=`<button id="prev" aria-label="前一天">‹</button>
    <span class="d"><b>${d.getMonth()+1} 月 ${d.getDate()} 日</b> · ${wd}</span>
    <span class="tag">${tag}${plan.swim?' · 游泳日':''}</span>
    <span class="ping">${state.dayOffset===0?'按 28 天食谱：第 '+(curWeek+1)+' 周 · '+wd:''}</span>
    <button id="next" aria-label="后一天">›</button>`;
  $('#prev').onclick=()=>{state.dayOffset--;renderToday()};
  $('#next').onclick=()=>{state.dayOffset++;renderToday()};
  $('#todaycards').innerHTML=[['b','早饭'],['l','午饭'],['d','晚饭']].map(([k,label])=>{
    const m=plan[k], on=!!e[k];
    const snack=(k==='l'&&plan.s)?`<div class="snack">泳前加餐：${plan.s}</div>`:'';
    return `<div class="eatcard${on?' done':''}">
      <span class="ico">${ico(m[0])}</span>
      <div><div class="k">${label}</div><div class="nm">${m[0]}</div><div class="nt">${m[1]}</div>${snack}</div>
      <button class="tick" data-k="${k}" aria-pressed="${on}" aria-label="记这顿吃过了"></button></div>`;
  }).join('');
  $$('#todaycards .tick').forEach(b=>b.onclick=()=>{
    const on=!eatenOf(d)[b.dataset.k];
    setEaten(d,b.dataset.k,on); renderToday(); renderNow(); renderWeeks();
  });
}

/* 28 天 */
function renderWeeks(){
  const t=new Date();
  $('#weeks').innerHTML=PLAN.map((days,w)=>{
    const rows=days.map((p,di)=>{
      const date=dateOf(w,di), e=eatenOf(date), isToday=ymd(date)===ymd(t);
      const cell=(k,label)=>{
        const on=!!e[k], m=p[k];
        const snack=(k==='l'&&p.s)?`<div class="snack">泳前加餐：${p.s}</div>`:'';
        return `<td class="cell${on?' done':''}" data-k="${k}" data-d="${ymd(date)}" data-l="${label}"
          tabindex="0" role="button" aria-pressed="${on}">
          <div class="nm">${ico(m[0])}<span>${m[0]}</span></div><div class="nt">${m[1]}</div>${snack}</td>`;
      };
      return `<tr class="${isToday?'today':''}" id="${isToday?'todayrow':''}">
        <td class="day"><span class="n">${String(di+1).padStart(2,'0')}</span>${p.day}
          ${p.y?'<span class="tag egg">全蛋</span>':''}${p.swim?'<span class="tag swim">游泳</span>':''}
          ${(!p.swim&&!p.y&&di===6)?'<span class="tag rest">休息</span>':''}
          ${isToday?'<span class="tag now">今天</span>':''}</td>
        ${cell('b','早饭')}${cell('l','午饭')}${cell('d','晚饭')}</tr>`;
    }).join('');
    return `<div class="wk" id="wk${w}"><div class="wk-top"><div class="wk-no">${String(w+1).padStart(2,'0')}</div>
      <div class="wk-name">第 ${w+1} 周</div><div class="wk-sub">周一 — 周日${w===curWeek?' · 本周':''}</div></div>
      <table class="tbl"><thead><tr><th>日</th><th>早饭</th><th>午饭 · 泳前加餐</th><th>晚饭</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }).join('');
  $$('#weeks .cell').forEach(td=>{
    const fire=()=>{
      const d=new Date(td.dataset.d+'T12:00:00');
      const on=!eatenOf(d)[td.dataset.k];
      setEaten(d,td.dataset.k,on);
      td.classList.toggle('done',on); td.setAttribute('aria-pressed',on);
      renderNow(); if(state.dayOffset===0) renderToday();
    };
    td.onclick=fire;
    td.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fire()}};
  });
}

document.addEventListener('DOMContentLoaded',()=>{
  renderRibbon(); renderTimeline(); renderToday(); renderWeeks(); renderNow();
  $$('#nowdots .dot-btn').forEach(b=>b.onclick=()=>{
    const d=new Date(), on=!eatenOf(d)[b.dataset.k];
    setEaten(d,b.dataset.k,on); renderNow(); renderToday(); renderWeeks();
  });
  const syncType=()=>$$('#daytype button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===state.view));
  syncType();
  $$('#daytype button').forEach(b=>b.onclick=()=>{
    state.view=b.dataset.v; syncType(); renderTimeline(); renderRibbon(); renderNow();
  });
  $('#jump').onclick=()=>{
    const row=$('#todayrow');
    if(row) smoothTo(row.getBoundingClientRect().top+window.scrollY-120);
  };
  $('#printbtn').onclick=()=>window.print();
  // 每分钟整点后刷新一次（不是固定 30 秒，避免分钟数滞后）
  const scheduleNow=()=>{
    const n=new Date();
    const wait=60000-(n.getSeconds()*1000+n.getMilliseconds())+40;
    setTimeout(()=>{renderNow();scheduleNow();},Math.max(800,wait));
  };
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderNow();});
  scheduleNow();
});


const GATE={on:false, hash:''};
async function sha256(t){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
(async function(){
  if(location.hash.startsWith('#h=')){
    try{alert('口令哈希（填到 GATE.hash）：\n'+await sha256(decodeURIComponent(location.hash.slice(3))));}
    catch(e){alert('这个浏览器算不了，请用 Chrome/Edge 打开');}
    return;
  }
  if(!GATE.on) return;
  if(sessionStorage.getItem('gate-ok')==='1') return;
  const g=document.getElementById('gate'); g.classList.add('on');
  const btn=document.getElementById('gbtn'), inp=document.getElementById('gpass'), err=document.getElementById('gerr');
  btn.onclick=async()=>{
    try{
      const h=await sha256(inp.value.trim());
      if(h===GATE.hash){sessionStorage.setItem('gate-ok','1');g.classList.remove('on')}
      else err.textContent='口令不对';
    }catch(e){err.textContent='浏览器不支持，换个浏览器试试';}
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')btn.click()});
  inp.focus();
})();
